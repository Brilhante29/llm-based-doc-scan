services:
  ollama:
    image: ollama/ollama:0.35.1
    volumes:
      - ./ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=5m
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # One-shot job: downloads the model into the shared volume before the app starts.
  ollama-pull:
    image: ollama/ollama:0.35.1
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-llama3}"]
    restart: "no"

  streamlit-app:
    build:
      context: ..
      dockerfile: app/Dockerfile
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3}
      - OCR_LANG=${OCR_LANG:-por+eng}
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
